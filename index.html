<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Reel Creator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
      background: #f5f5f5;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      margin: 10px 0;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #222;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>AI Reel Creator</h1>

    <p>Create your Reel idea with AI.</p>

    <textarea id="prompt" placeholder="Enter your Reel idea..."></textarea>

    <button onclick="createReel()">Create Reel Idea</button>

    <h3>Result</h3>
    <p id="result"></p>
  </div>

  <script>
    function createReel() {
      const prompt = document.getElementById("prompt").value;

      if (!prompt) {
        document.getElementById("result").innerText =
          "Please enter a Reel idea.";
        return;
      }

      document.getElementById("result").innerText =
        "Your Reel idea: " + prompt;
    }
  </script>
</body>
</html>
